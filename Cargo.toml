[package]
name = "libnacelle"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "The toolkit the nacelle project is built on: drawing, fonts, themes, the responsive layout engine, interface objects, the widget contract and its scripting, terminal emulation, telemetry and sound"
license = "MIT"
repository = "https://github.com/JOCKER3201/libnacelle"

[lib]
name = "nacelle"

[dependencies]
# Font rasterization + glyph atlas
fontdue = "0.8"

# Flexbox layout engine (the algorithm web pages use)
taffy = "0.12.2"

# Loading eDEX-UI theme files (*.json)
serde_json = "1"

# Addon settings (src/settings.rs). RON rather than TOML because addon
# settings have shapes nobody has written yet: it carries enum variants,
# tuples and named structs natively, which is the whole reason the typed
# parse happens in the addon and not in the host. Theme files are NOT
# affected — the master is its own schema and documentation.
# Licence audit: 0.12.2, verdict CLEAR (licencje-zaleznosci.md). Two new
# packages in the subtree, the other nine were already here. 0.10.0 is
# yanked; do not widen the requirement to reach it.
ron = "0.12"
# Named explicitly because `settings::load` takes a `DeserializeOwned`
# bound; it was already in the tree under serde_json, so no new package.
serde = "1"

# ANSI/VT sequence parser (terminal emulation)
vte = "0.13"
unicode-width = "0.1"

# Grapheme-cluster and word boundaries for the text-input model
# (object/text_input.rs): the caret moves by graphemes, never chars.
unicode-segmentation = "1"

# Widget scripting: pure Rust, so building needs no C toolchain, and
# sandboxed by construction — a script sees only what it is given.
rhai = { version = "1.25.1", default-features = false, features = ["std", "sync"] }

# Wall clock for widgets that show the time
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# SVG -> coverage-mask rasterization for the icon atlas (src/icon.rs, K8).
# `resvg` re-exports `usvg` (parse) and `tiny-skia` (raster), which is why
# it is the one entry here rather than three.
#
# Pinned at 0.45.1 and not the crate's current default (0.48.x) for two
# reasons found by checking the crate's OWN history rather than its name,
# per this project's hard rule (MIT/Apache/BSD only, for anything linked):
#
# * `resvg` changed OWNER and LICENCE mid-series. Every version through
#   0.44.0, published under `RazrFalcon/resvg`, carries `license = "MPL-2.0"`
#   — a per-file copyleft this project's rule excludes. `linebender/resvg`
#   picked the project up at 0.45.0 and relicensed the whole tree dual
#   `MIT OR Apache-2.0`; every version from 0.45.0 on states that licence.
#   A caller trusting the crate NAME instead of the crate's own metadata
#   at the version it pins would have linked MPL-2.0 code and never known.
# * 0.45.1 is the oldest of the relicensed line, and its own
#   `rust-version` is 1.67.1 — under this crate's `rust-version = "1.77"`.
#   0.46.0 raised it to 1.87.0, past what this crate promises; taking the
#   newer resvg would either break that promise or force it up silently.
#
# `default-features = false`: the defaults (`text`, `system-fonts`,
# `memmap-fonts`, `raster-images`) pull `fontdb`/`rustybuzz` (SVG <text>
# shaped against the system's fonts) and raster-image decoders this
# project's icons have no use for — an icon is a flat vector shape, the
# same assumption every icon SET in the wild makes. Turning them off
# keeps the dependency to `usvg`'s vector core and `tiny-skia`'s
# rasteriser, both permissively licensed themselves (checked at the same
# pin: `usvg` 0.45.1 `MIT OR Apache-2.0`, `tiny-skia` 0.12.0
# `BSD-3-Clause`, and every crate either pulls in transitively —
# `svgtypes`, `roxmltree`, `kurbo`, `data-url`, `flate2`, `base64`,
# `xmlwriter`, `simplecss`, `siphasher`, `strict-num`, `imagesize`,
# `once_cell`, `pico-args`, `png`, `rgb`, `log` — MIT, Apache-2.0 or both).
#
# Verdict: CLEAR at 0.45.1, default-features = false.
resvg = { version = "=0.45.1", default-features = false }

# Precompiled SPIR-V border-effect shaders. Re-exported at the crate root
# as `nacelle::shaders` (see lib.rs) so libnacelle is compiled together
# with its effects rather than an application wiring a second dependency
# on its own. Own repo because WGSL/SPIR-V authoring is a different craft
# from the rest of this crate, not because it needs to move independently.
nacelle-shaders = { git = "https://github.com/JOCKER3201/nacelle-shaders" }

[dev-dependencies]
# The derive is only ever used by tests here — the toolkit deserialises
# nothing of its own, it hands `settings::load` an addon's type. Keeping
# the feature out of the ordinary build keeps a proc macro out of it too.
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
# dlopen for compiled widget plugins (widget/loader.rs)
libc = "0.2"
